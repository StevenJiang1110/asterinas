name: Test OSDK image build (no push)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.prepare.outputs.image_version }}
      rust_version: ${{ steps.prepare.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DOCKER_IMAGE_VERSION
            rust-toolchain.toml
      - name: Read build versions
        id: prepare
        run: |
          echo "image_version=$(cat DOCKER_IMAGE_VERSION)" >> "$GITHUB_OUTPUT"
          echo "rust_version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

  build_osdk_dev_image:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: false
      registry-login: 'false'
      sign: 'false'
      platforms: linux/amd64,linux/arm64
      context: .
      file: ./osdk/tools/docker/Dockerfile
      meta-images: asterinas/osdk-dev
      meta-tags: |
        type=raw,value=${{ needs.prepare.outputs.image_version }}
      build-args: |
        ASTER_RUST_VERSION=${{ needs.prepare.outputs.rust_version }}
      cache: true
      cache-scope: osdk-rustsbi-ci
      cache-mode: max

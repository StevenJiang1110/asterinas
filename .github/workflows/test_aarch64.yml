name: "Test aarch64  "

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  basic-test:
    name: ${{ matrix.id }} (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    container:
      image: asterinas/kernel-dev:0.18.1-20260926
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        runs_on: ['ubuntu-latest', 'ubuntu-24.04-arm']
        id: ['lint', 'compile']
      fail-fast: false
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run basic tests
        uses: ./.github/actions/test
        with:
          auto_test: 'general'
          arch: 'aarch64'

  integration-test:
    name: ${{ matrix.test_id }} (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    container:
      image: asterinas/kernel-dev:0.18.1-20260926
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        runs_on: ['ubuntu-latest', 'ubuntu-24.04-arm']
        test_id: ['boot', 'conformance']
        release: [true]
      fail-fast: false
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Inspect ARM KVM availability
        if: ${{ matrix.runs_on == 'ubuntu-24.04-arm' }}
        run: |
          uname -m
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo '/dev/kvm is absent; QEMU will use software emulation.'
          fi
      - name: Run ${{ matrix.test_id }} tests
        env:
          OSDK_LOG_LEVEL: info
        uses: ./.github/actions/test
        with:
          auto_test: ${{ matrix.test_id }}
          release: ${{ matrix.release }}
          arch: 'aarch64'
          enable_kvm: ${{ matrix.runs_on == 'ubuntu-24.04-arm' }}
          conformance_test_suite: 'ltp'
